[package]
name = "tps_client_common"
version = "0.10.0"
edition = "2024"
authors = ["Jeremy O'Donoghue <quic_jodonogh@quicinc.com", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
license = "MIT"
description = "Reference implementation of the GlobalPlatform Trusted Platform Services API"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# tps_client_common is normally built `no_std`. `std` is enabled for host-side testing/tooling.
rust-version = "1.85"
readme = "README.md"
keywords = ["tps", "globalplatform", "no-std", "embedded", "uuid"]
categories = ["no-std", "embedded", "api-bindings"]

[features]
std = []

[dependencies]
