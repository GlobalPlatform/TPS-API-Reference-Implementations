#
# tps_cbor_ide is its own Cargo workspace (see the [workspace] comment in Cargo.toml), so the root
# deny.toml never sees its dependency graph and this file is needed to check it. Run:
#
#     cargo deny --manifest-path tps_cbor_ide/Cargo.toml check licenses
#
# The [advisories] and [licenses] allow-list below is kept identical to the root deny.toml on
# purpose: the licence policy is the project's, not this crate's. Only the MPL-2.0 exceptions
# differ, and they differ only because the graphs differ. If the allow-list is changed at the root,
# change it here too; if tps_cbor_ide ever rejoins the root workspace, delete this file and move
# the two exceptions back.

[advisories]
version = 2
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Identical to the root deny.toml; see that file for the reasoning behind each entry.
allow = [
    "MIT",
    "Unicode-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Zlib",
]

# MPL-2.0 is deliberately not in the list above. It is file-scoped ("weak") copyleft, so it does
# not infect our own code -- section 3.3 lets us distribute a Larger Work under terms of our choice
# -- but section 3.2(a) requires that when we ship an executable containing MPL files we also make
# those files' source available and tell recipients how to obtain it, and we may not relicense them
# under MIT. That is an obligation MIT does not carry, so it is granted per crate below.

# Code generated by cbindgen is not covered by MPL, and cbindgen is a *build* dependency only --
# it generates headers at compile time and no part of it is linked into the binary, so section
# 3.2(a) never attaches to anything we ship. Reached here through GPUI's Apple backend
# (gpui-pre-apple -> gpui-pre-{ios,macos} -> gpui-pre-platform -> gpui-kit), so it is present in
# the graph even on Linux, where cargo-deny considers all targets by default. The root deny.toml
# grants the same exception for tps_client_c.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cbindgen"

# option-ext is unavoidable for any GPUI application. It arrives through GPUI's font loading
# (gpui-pre-platform -> gpui-pre-linux -> gpui-pre-wgpu -> zed-font-kit -> dirs 5 -> dirs-sys 0.4
# -> option-ext) and independently through its asset embedding (gpui-kit-assets -> rust-embed ->
# rust-embed-impl -> shellexpand -> dirs 6 -> dirs-sys 0.5 -> option-ext). Dropping the "assets"
# feature closes only the second path, so there is no feature selection that removes it.
#
# It is used unmodified, so the section 3.2(a) duty is satisfied by pointing recipients at the
# upstream source; it carries no patch of ours that would need publishing separately.
#
# This crate is `publish = false` and distributed as a built binary, so the duty attaches to the
# binary rather than to anything this workspace publishes.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "option-ext"

# dwrote is GPUI's DirectWrite backend, reached only on Windows. It is in the graph here because
# cargo-deny considers all targets unless `targets` is set, so this exception is matched even when
# checking from Linux. It would become unmatched if this file ever narrows to the host target.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "dwrote"
