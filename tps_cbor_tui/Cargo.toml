[package]
name = "tps_cbor_tui"
version = "0.10.1"
authors = ["Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
edition = "2024"
license = "MIT"
description = "Terminal (ratatui) workbench for CDDL editing, CBOR/EDN viewing, and COSE sign/encrypt"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
rust-version = "1.85"
readme = "README.md"
keywords = ["cbor", "cddl", "cose", "tui", "edn"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "cbor-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
# Deliberately the same major version ratatui measures its own cells with, so
# `ui::wrap` breaks lines on the column the renderer will actually draw them
# in. A wrap that counted differently from the renderer would put the cursor
# on the wrong cell for every line holding a wide character.
unicode-width = "0.2"
crossterm = "0.29"
tps_cbor_core = { path = "../tps_cbor_core", version = "0.10.0" }
tps_minicbor = { path = "../tps_minicbor", version = "0.10.0", features = ["std", "edn", "diagnostic", "float"] }
tps_cddl = { path = "../tps_cddl", version = "0.10.0", features = ["modules"] }
tps_cose = { path = "../tps_cose", version = "0.10.0", features = ["ring", "std", "cose_sign", "float"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-edn = { path = "../tree-sitter-edn", version = "0.10.0" }
hex = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zeroize = "1"
arboard = "3"
