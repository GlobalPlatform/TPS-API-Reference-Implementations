[package]
name = "rot13_service"
version = "0.10.0"
edition = "2024"
license = "MIT"
authors = ["Jeremy O'Donoghue <quic_jodonogh>@quicinc.com", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
description = "Minmal reference implementation of a ROT13 Service for the GlobalPlatform Trusted Platform Services API"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
rust-version = "1.85"
readme = "README.md"
keywords = ["tps", "globalplatform", "service", "example", "no-std"]
categories = ["no-std", "embedded"]
# Not published to crates.io: reference example only, paired with rot13_connector.
publish = false


[dependencies]
tps_minicbor = { path = "../tps_minicbor", version = "0.10.0" }
tps_client_common = { path = "../tps_client_common", version = "0.10.0" }

[features]
# Standard library available. Must forward to the dependencies' own `std` features: a bare
# `std = []` would gate only this crate's `extern crate std` and leave them `no_std`.
std = ["tps_minicbor/std", "tps_client_common/std"]
