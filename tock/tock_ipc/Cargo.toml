[package]
name = "tock_ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal Rust wrapper for Tock's IPC syscall driver (0x10000), built on libtock_platform::Syscalls"

[dependencies]
libtock_platform = { path = "../third_party/libtock-rs/platform" }

[dev-dependencies]
libtock_unittest = { path = "../third_party/libtock-rs/unittest" }
