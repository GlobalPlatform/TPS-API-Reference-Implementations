[advisories]
version = 2
# Report unmaintained packages that are workspace-direct dependencies.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# This workspace is MIT. A dependency licence is allowed here only if it imposes no obligation
# that an MIT-licensed distribution cannot already satisfy, so that a recipient of anything we
# publish can rely on MIT terms for the whole of it.
#
# BSL-1.0 (Boost Software License 1.0) is more permissive than MIT, not less: its attribution
# clause is explicitly waived when the software is distributed "solely in the form of
# machine-executable object code generated by a source language processor", whereas MIT requires
# the notice in all copies. Nothing it asks for is not already required of us.
#
# Apache-2.0 WITH LLVM-exception is strictly weaker than the plain Apache-2.0 already allowed
# above: the exception releases embedded object code from Apache-2.0 sections 4(a), 4(b) and 4(d).
# Allowing Apache-2.0 while rejecting a less demanding variant of it was an oversight.
#
# CC0-1.0 and 0BSD are accepted on the same footing as MIT. 0BSD is MIT without the attribution
# requirement. CC0-1.0 is a public-domain dedication, and its section 4(a) reservation of patent
# rights is not a reason to treat it as weaker than the rest of this list: MIT does not mention
# patents at all and grants no patent rights either, so rejecting CC0-1.0 on that ground would
# hold dependencies to a stricter standard than this project applies to its own code. Where a
# dependency offers Apache-2.0 as an alternative, electing it obtains an express patent licence
# under Apache-2.0 section 3; that is a per-dependency election, not a property of this list.
#
# CC0-1.0 is *not* in the list below, and that is not a reversal of the paragraph above. Retiring
# tps_cbor_gui took the only CC0-1.0 crate out of this graph, and cargo-deny warns
# `license-not-encountered` for an allowance nothing matches. It remains allowed in
# tps_cbor_ide/deny.toml, where it is still reached; restore it here the moment a root-workspace
# crate needs it, on the reasoning above.
allow = [
    "MIT",
    "Unicode-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "ISC",
    "Zlib",
]


# Code generated by cbindgen is not covered by MPL
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cbindgen"
