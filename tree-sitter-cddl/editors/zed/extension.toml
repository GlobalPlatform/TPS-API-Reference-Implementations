# builds the grammar itself; it does not accept a local path here). Until
# `tree-sitter-cddl` is split into its own published repo (or this monorepo
# is pushed somewhere fetchable), load this extension as a *dev extension*
# instead (see README.md) — dev extensions build the grammar from the local
# checkout and do not need this section to resolve.
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
