[package]
name = "tps_minicbor"
version = "0.10.0"
authors = ["Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
edition = "2024"
license = "MIT"
description = "A CBOR encoder and decoder suitable for `no_std` embedded targets."
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
rust-version = "1.85"
readme = "README.md"
keywords = ["cbor", "rfc8949", "no-std", "serialization", "embedded"]
categories = ["encoding", "no-std", "embedded"]

[dependencies]
half = { version = "2.7.1", default-features = false, optional = true }
ryu = { version = "1.0.23", default-features = false, optional = true }
thiserror = { version = "2", default-features = false }

[features]
float = ["dep:half"]
diagnostic = ["dep:ryu", "std"]
edn = ["std", "float"]
std = []
deterministic_encoding = ["std"]
standard_tags = []
spans = []
