[package]
name = "tps_cddl"
authors = ["Jeremy O'Donoghue <jodonogh@quti.qualcomm.com>"]
version = "0.10.0"
edition = "2024"
description = "IETF CDDL (RFC 8610, RFC9165, RFC9682) parser, validator, and code generator"
license = "MIT"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
rust-version = "1.85"
readme = "README.md"
keywords = ["cddl", "rfc8610", "cbor", "validator", "codegen"]
categories = ["parser-implementations", "encoding", "development-tools"]

[lib]
name = "tps_cddl"
path = "src/lib.rs"

[[bin]]
name = "cddl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
tps_minicbor = { path = "../tps_minicbor", version = "0.10.0", features = ["float", "spans"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
# Enable RFC 9165 additional control operators
rfc9165 = []
# Enable RFC 9682 grammar corrections and additions
rfc9682 = []
# Enable all extensions
all_extensions = ["rfc9165", "rfc9682"]
# Enable CDDL module structure (draft-ietf-cbor-cddl-modules-06): ;# import/include directives
modules = []
