[package]
name = "tps_client_api"
version = "0.10.0"
edition = "2024"
authors = ["Jeremy O'Donoghue <quic_jodonogh@quicinc.com>", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
license = "MIT"
description = "Reference implementation of the GlobalPlatform Trusted Platform Services API"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

rust-version = "1.85"
readme = "README.md"
keywords = ["tps", "globalplatform", "no-std", "embedded", "api"]
categories = ["no-std", "embedded", "api-bindings"]

# TPS Client API is normally built `no_std` and does not require an allocator.
# Exception is when it is built for testing
[features]
trace = ["std"]
std = ["thiserror/std", "tps_client_common/std", "tps_error/std", "tps_connector/std", "critical-section/std"]

[dependencies]
thiserror = { version = "2", default-features = false }
func_trace = "1.0.3"
critical-section = "1.2.0"
tps_client_common = { path = "../tps_client_common", version = "0.10.0" }
tps_error = { path = "../tps_error", version = "0.10.0" }
tps_connector = { path = "../tps_connector", version = "0.10.0"}

[dev-dependencies]
# Deliberately path-only, with no `version`: both rot13 crates are `publish = false`, and cargo
# keeps a *versioned* path dev-dependency in the published manifest (where it would then fail to
# resolve from the registry) but strips a version-less one entirely. Do not add a version here.
rot13_connector = { path = "../rot13_connector", features = ["std"] }
rot13_service = { path = "../rot13_service", features = ["std"] }
tps_minicbor = { path = "../tps_minicbor", version = "0.10.0", features = ["std"] }
# `critical-section`'s `std` feature provides the `Impl` (backed by `std::sync::Mutex`) that
# `crate::sync` needs at link time. It's requested here rather than unconditionally, so a plain
# `no_std` build of this crate (its normal mode) doesn't pull in an unregistered `Impl` — a
# real no_std consumer (e.g. a Tock app) registers its own via `critical_section::set_impl!`.
# Cargo's resolver-2 feature unification applies dev-dependency features to test/bench builds of
# this same package, so `cargo test` (no explicit `--features`) picks this up automatically.
critical-section = { version = "1.2.0", features = ["std"] }
