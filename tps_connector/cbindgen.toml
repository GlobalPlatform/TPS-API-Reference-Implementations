###################################################################################################
# General header structure
###################################################################################################

language = "C"

header = """
/***************************************************************************************************
 * Copyright (c) Qualcomm Technologies, Inc. and/or its subsidiaries
 * SPDX-License-Identifier: MIT
 **************************************************************************************************/
 /***************************************************************************************************
 * tpsc_connector_api.h
 *
 * This is the C language header file for a Secure Component connector.
 *
 **************************************************************************************************/
 """

autogen_warning = """
/*****                            AUTOGENERATED FILE - DO NOT EDIT                            *****/
"""

include_guard = "tpsc_connector_api_h"
includes = ["tpsc_client_api.h"]
pragma_once = true
include_version = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
# after_includes = """ """

###################################################################################################
# Formatting
###################################################################################################

braces = "SameLine"
line_length = 100
tab_width = 4
style = "type"

###################################################################################################
# Export definitions
###################################################################################################

[export]
prefix = "TPSC_"
item_types = ["structs", "typedefs", "functions", "opaque"]
renaming_overrides_prefixing = true

[export.mangle]
rename_types = "PascalCase"
remove_underscores = true

###################################################################################################
# Functions
###################################################################################################

[fn]
args = "vertical"
rename_args = "None"
sort_by = "Name"

###################################################################################################
# Structs, Enums, Unions
###################################################################################################

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"

[const]
sort_by = "None"
