[package]
name = "tps_connector"
version = "0.10.0"
edition = "2024"
license = "MIT"
authors = ["Jeremy O'Donoghue <quic_jodonogh@quicinc.com>", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
description = "Reference implementation of the GlobalPlatform Trusted Platform Services API"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

rust-version = "1.85"
readme = "README.md"
keywords = ["tps", "globalplatform", "connector", "no-std", "ffi"]
categories = ["no-std", "embedded", "api-bindings"]

# tps_connector is normally built `no_std`. `std` is enabled for host-side testing/tooling.
[features]
std = ["tps_client_common/std", "tps_error/std"]

[dependencies]
tps_client_common = { path = "../tps_client_common", version = "0.10.0" }
tps_error = { path = "../tps_error", version = "0.10.0" }

[build-dependencies]
cbindgen = "0.29.4"
