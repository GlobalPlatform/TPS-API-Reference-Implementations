[package]
name = "tps_cose"
version = "0.10.0"
edition = "2024"
license = "MIT"
authors = ["Jeremy O'Donoghue <quic_jodonogh@quicinc.com>", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
description = "COSE (RFC 9052) encoder/decoder supporting a selection of crypto algorithms, usable without an allocator or the standard library"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
rust-version = "1.85"
readme = "README.md"
keywords = ["cose", "rfc9052", "cbor", "crypto", "no-std"]
categories = ["cryptography", "encoding", "no-std"]

[dependencies]
tps_minicbor = { path = "../tps_minicbor", version = "0.10.0", default-features = false }
thiserror = { version = "2", default-features = false }
ring = { version = "0.17.8", optional = true }
aes = { version = "0.9.3", optional = true, default-features = false }
ccm = { version = "0.6.1", optional = true, default-features = false }

[features]
default = []
alloc = []
std = ["alloc"]
ring = ["dep:ring", "dep:aes", "dep:ccm", "std"]
float = ["tps_minicbor/float"]
cose_sign = []

[dev-dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
base64 = "0.23.1"
