[package]
name = "tps_error"
version = "0.10.0"
edition = "2024"
authors = ["Jeremy O'Donoghue <quic_jodonogh@quicinc.com>", "Jeremy O'Donoghue <jodonogh@qti.qualcomm.com>"]
license = "MIT"
description = "Error definitions for TPS Client API"
homepage = "https://globalplatform.org"
repository = "https://github.com/GlobalPlatform/TPS-API-Reference-Implementations"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

rust-version = "1.85"
readme = "README.md"
keywords = ["tps", "globalplatform", "error", "no-std", "embedded"]
categories = ["no-std", "embedded"]

# tps_error is normally built `no_std`. `std` is enabled for host-side testing/tooling.
[features]
std = ["thiserror/std", "tps_client_common/std"]

[dependencies]
thiserror = { version = "2", default-features = false }
tps_client_common = { path = "../tps_client_common", version = "0.10.0" }
